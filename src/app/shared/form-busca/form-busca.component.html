<app-card variant="secondary" class="form-busca">
  <form [formGroup]="buscaForm" (ngSubmit)="onBuscar()">
    <h2>Passagens</h2>
    <div class="flex-container">
      <mat-button-toggle-group aria-label="Tipo de passagem" formControlName="tipo" (change)="alterarTipoPassagem($event.value)">
        <mat-button-toggle value="ida-volta">
          <mat-icon *ngIf="buscaForm.get('tipo')?.value === 'ida-volta'">check</mat-icon>
          IDA E VOLTA
        </mat-button-toggle>
        <mat-button-toggle value="somente-ida">
          <mat-icon *ngIf="buscaForm.get('tipo')?.value === 'somente-ida'">check</mat-icon>
          SOMENTE IDA
        </mat-button-toggle>
      </mat-button-toggle-group>
      <mat-chip-listbox (click)="openDialog()" aria-label="Seleção de passagens">
        <mat-chip-option selected>{{ obterResumoPassageiros() }}</mat-chip-option>
        <mat-chip-option selected>{{ obterCategoria() }}</mat-chip-option>
      </mat-chip-listbox>
    </div>
    <div class="flex-container inputs-row">
      <mat-form-field class="input-container" appearance="outline">
        <mat-label>Origem</mat-label>
        <mat-icon matPrefix>
          flight_takeoff
        </mat-icon>
        <input matInput placeholder="Origem" formControlName="origem">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>

      <button type="button" mat-icon-button class="swap-button" (click)="inverterOrigemDestino()">
        <mat-icon>sync_alt</mat-icon>
      </button>

      <mat-form-field class="input-container" appearance="outline">
        <mat-label>Destino</mat-label>
        <mat-icon matPrefix>
          flight_land
        </mat-icon>
        <input matInput placeholder="Destino" formControlName="destino">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>

      <mat-form-field class="input-container" appearance="outline">
        <mat-label>Data de ida</mat-label>
        <input matInput [matDatepicker]="ida" formControlName="dataIda">
        <mat-datepicker-toggle matIconSuffix [for]="ida"></mat-datepicker-toggle>
        <mat-datepicker #ida></mat-datepicker>
      </mat-form-field>

      <mat-form-field class="input-container" appearance="outline">
        <mat-label>Data da volta</mat-label>
        <input matInput [matDatepicker]="volta" formControlName="dataVolta">
        <mat-datepicker-toggle matIconSuffix [for]="volta"></mat-datepicker-toggle>
        <mat-datepicker #volta></mat-datepicker>
      </mat-form-field>

      <button type="submit" mat-flat-button color="primary" class="buscar-btn">BUSCAR</button>
    </div>
  </form>
</app-card>
