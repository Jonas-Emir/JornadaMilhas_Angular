<mat-card class="depoimento">
  <mat-card-content>
    <img [src]="depoimentoItem.avatar" [alt]="'Avatar de ' + depoimentoItem.autoria" class="avatar-img">
    <div class="depoimento-texto">
      <mat-icon class="quote-icon">format_quote</mat-icon>
      <p class="texto">{{ depoimentoItem.depoimento }}</p>
      <span class="autoria">{{ depoimentoItem.autoria }}</span>
    </div>
  </mat-card-content>
</mat-card>
